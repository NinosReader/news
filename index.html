<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global News Tower</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --night: #070b14;
            --building: #151a28;
            --edge: #1e2540;
            --gold: #d4bf6a;
            --gold-dim: #9a8a48;
            --dim: #6b7394;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--night);
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background: radial-gradient(ellipse at 50% 0%, #0e1525 0%, var(--night) 70%); }
        .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle 4s ease-in-out infinite; }
        @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.7; } }

        .scene { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 24px 16px 40px; }

        .header { text-align: center; margin-bottom: 28px; animation: fadeIn .8s ease; }
        .header h1 {
            font-family: 'Playfair Display', serif; font-size: clamp(1.6rem,4.5vw,2.5rem);
            font-weight: 900; color: #fff; letter-spacing: .03em;
            text-shadow: 0 0 40px rgba(255,255,255,.12);
        }
        .header .sub {
            font-size: 11px; color: #fff; margin-top: 6px;
            font-weight: 300; letter-spacing: .07em; text-transform: uppercase;
        }
        @keyframes fadeIn { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }

        .building {
            background: linear-gradient(180deg, var(--edge) 0%, var(--building) 5%, var(--building) 95%, #111520 100%);
            border-radius: 6px 6px 0 0; padding: 22px 16px 28px; position: relative;
            box-shadow: 0 0 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.02),
                        -3px 0 0 #12162080, 3px 0 0 #12162080;
        }
        .building::before {
            content:''; position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
            width: 2px; height: 30px; background: linear-gradient(to top, var(--edge), transparent);
        }

        /* Section headers inside building */
        .section-label {
            text-align: center; padding: 18px 0 10px;
            font-family: 'Playfair Display', serif; font-size: 13px;
            color: #fff; letter-spacing: .05em; font-weight: 700;
            border-top: 1px solid rgba(255,255,255,.04);
        }
        .section-label:first-child { border-top: none; padding-top: 0; }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 8px; }

        .paper {
            position: relative; border: 1.5px solid #1e2540; border-radius: 2px;
            overflow: hidden; aspect-ratio: 3/4.2; background: #0a0d14;
            box-shadow: inset 0 0 12px rgba(0,0,0,.4);
            transition: all .3s ease; cursor: pointer;
        }
        .paper:hover {
            transform: scale(1.03); border-color: var(--gold-dim);
            box-shadow: 0 0 30px rgba(212,191,106,.1), 0 4px 20px rgba(0,0,0,.4);
            z-index: 5;
        }
        .paper.hidden { display: none; }

        .paper img {
            width: 100%; height: 100%; object-fit: cover; object-position: top center;
            display: block; opacity: 0; transition: opacity .3s ease;
        }
        .paper img.loaded { opacity: 1; }

        .paper .shimmer {
            position: absolute; inset: 0;
            background: linear-gradient(110deg, #0d1018 30%, #151a28 50%, #0d1018 70%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
        }
        .paper .shimmer.done { opacity: 0; transition: opacity .3s; pointer-events: none; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .paper .label {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(7,11,20,.94) 0%, rgba(7,11,20,.7) 50%, transparent 100%);
            padding: 28px 8px 7px; text-align: center;
            opacity: 0; transition: opacity .25s; pointer-events: none;
        }
        .paper:hover .label { opacity: 1; }
        .label .name {
            font-family: 'Playfair Display',serif; font-weight: 700;
            font-size: 12px; color: #fff; display: block;
        }
        .label .region { font-size: 9px; color: #fff; display: block; margin-top: 2px; }

        /* Loading state */
        .loading-msg {
            text-align: center; padding: 40px 20px; color: #fff;
            font-size: 13px; letter-spacing: .03em;
        }
        .loading-msg .dots::after {
            content: ''; animation: dots 1.5s infinite;
        }
        @keyframes dots {
            0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; }
        }

        /* Progress counter */
        .progress-msg {
            text-align: center; padding: 10px 20px 16px; color: rgba(255,255,255,.5);
            font-size: 11px; letter-spacing: .03em;
            transition: opacity .3s;
        }

        .foot { text-align: center; margin-top: 22px; }
        .foot p { font-size: 10px; color: #fff; letter-spacing: .04em; }
        .foot a {
            display: inline-block; margin-top: 12px;
            color: #fff; text-decoration: none; font-size: 13px;
            background: rgba(21,26,40,.8); padding: 8px 18px; border-radius: 5px;
            border: 1px solid var(--edge); transition: all .3s;
        }
        .foot a:hover { background: #fff; color: var(--night); border-color: #fff; }

        .copy { text-align: center; font-size: 10px; color: rgba(255,255,255,.5); margin-top: 20px; }

        .modal-bg {
            position: fixed; inset: 0; background: rgba(2,3,8,.95); z-index: 100;
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
        }
        .modal-bg.open { display: flex; }
        .modal {
            background: var(--building); border: 1px solid var(--edge); border-radius: 6px;
            width: min(94vw,700px); max-height: 92vh;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 30px 100px rgba(0,0,0,.9);
            animation: modalIn .3s cubic-bezier(.16,1,.3,1);
        }
        @keyframes modalIn { from{opacity:0;transform:scale(.95);} to{opacity:1;transform:scale(1);} }
        .modal-top {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.04); flex-shrink: 0;
        }
        .modal-top .title { font-family:'Playfair Display',serif; font-weight:700; color:#fff; font-size:14px; }
        .modal-top .actions { display:flex; gap:8px; align-items:center; }
        .modal-top a {
            color:#fff; text-decoration:none; font-size:11px; font-weight:500;
            border:1px solid rgba(255,255,255,.3); padding:3px 10px; border-radius:3px; transition:all .2s;
        }
        .modal-top a:hover { background:#fff; color:var(--night); }
        .modal-top button {
            background:none; border:1px solid rgba(255,255,255,.08); color:#fff;
            width:28px; height:28px; border-radius:3px; cursor:pointer; font-size:14px;
            display:flex; align-items:center; justify-content:center;
        }
        .modal-body { overflow:auto; flex:1; background:#0a0d14; }
        .modal-body img { width:100%; display:block; }

        @media (max-width:600px) {
            .grid { gap: 8px; }
            .building { padding: 18px 10px 22px; }
        }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="scene">
    <div class="header">
        <h1>Global News Tower</h1>
        <div class="sub" id="dateStr"></div>
    </div>

    <div class="building" id="building">
        <div class="loading-msg" id="loadingMsg">
            Fetching today's front pages<span class="dots"></span>
        </div>
    </div>

    <div class="foot">
        <p>Click any front page to expand · Hover for name</p>
        <a href="https://ninosreader.github.io/index/" target="_blank">📄 Read articles without paywalls</a>
    </div>
    <div class="copy">© Global News Tower</div>
</div>

<div class="modal-bg" id="modalBg">
    <div class="modal">
        <div class="modal-top">
            <span class="title" id="mTitle"></span>
            <div class="actions">
                <a id="mLink" href="#" target="_blank">Visit Site ↗</a>
                <button id="mClose">✕</button>
            </div>
        </div>
        <div class="modal-body" id="mBody"></div>
    </div>
</div>

<script>
// Date display
document.getElementById('dateStr').textContent =
    new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});

// Papers we want, keyed by frontpages.com slug
var PAPERS = {
    // US
    'the-new-york-times':    { name:'The New York Times',    region:'New York',   url:'https://www.nytimes.com',          section:'United States' },
    'the-washington-post':   { name:'The Washington Post',   region:'Washington', url:'https://www.washingtonpost.com',   section:'United States' },
    'los-angeles-times':     { name:'Los Angeles Times',     region:'Los Angeles',url:'https://www.latimes.com',          section:'United States' },
    'usa-today':             { name:'USA Today',             region:'National',   url:'https://www.usatoday.com',         section:'United States' },
    'the-washington-times':  { name:'The Washington Times',  region:'Washington', url:'https://www.washingtontimes.com',  section:'United States' },
    'the-boston-globe':       { name:'The Boston Globe',      region:'Boston',     url:'https://www.bostonglobe.com',      section:'United States' },

    // UK & Europe
    'financial-times':       { name:'Financial Times',       region:'London',     url:'https://www.ft.com',               section:'United Kingdom & Europe' },
    'the-guardian':          { name:'The Guardian',          region:'London',     url:'https://www.theguardian.com',      section:'United Kingdom & Europe' },
    'the-times-uk':          { name:'The Times',             region:'London',     url:'https://www.thetimes.com',         section:'United Kingdom & Europe' },
    'the-daily-telegraph':   { name:'The Daily Telegraph',   region:'London',     url:'https://www.telegraph.co.uk',      section:'United Kingdom & Europe' },
    'le-monde':              { name:'Le Monde',              region:'Paris',      url:'https://www.lemonde.fr',           section:'United Kingdom & Europe' },

    // Asia, Middle East, Africa
    'the-japan-times':       { name:'The Japan Times',       region:'Tokyo',      url:'https://www.japantimes.co.jp',     section:'Asia & World' },
    'south-china-morning-post':{ name:'South China Morning Post', region:'Hong Kong', url:'https://www.scmp.com',         section:'Asia & World' },
    'the-straits-times':     { name:'The Straits Times',     region:'Singapore',  url:'https://www.straitstimes.com',     section:'Asia & World' },
    'haaretz':               { name:'Haaretz',               region:'Tel Aviv',   url:'https://www.haaretz.com',          section:'Asia & World' },
    'the-times-of-india':    { name:'The Times of India',    region:'Mumbai',     url:'https://timesofindia.indiatimes.com', section:'Asia & World' },
    'the-sydney-morning-herald':{ name:'Sydney Morning Herald', region:'Sydney',  url:'https://www.smh.com.au',           section:'Asia & World' },
};

var BASE = 'https://www.frontpages.com';
// Multiple CORS proxy options for resilience
var PROXIES = [
    'https://api.allorigins.win/raw?url=',
    'https://corsproxy.io/?',
    'https://api.codetabs.com/v1/proxy?quest='
];

// Fetch with proxy fallback
async function fetchWithProxy(url) {
    for (var i = 0; i < PROXIES.length; i++) {
        try {
            var resp = await fetch(PROXIES[i] + encodeURIComponent(url));
            if (resp.ok) return await resp.text();
        } catch(e) { /* try next */ }
    }
    return null;
}

// Parse frontpages.com listing HTML to extract {slug: imageUrl} map
function parseListingHTML(html) {
    var map = {};
    var parser = new DOMParser();
    var doc = parser.parseFromString(html, 'text/html');
    var links = doc.querySelectorAll('a[href]');
    links.forEach(function(a) {
        var href = a.getAttribute('href');
        if (!href || !href.match(/^\/[a-z]/)) return;
        var slug = href.replace(/^\/|\/$/g, '');
        var img = a.querySelector('img[src*="/t/"]');
        if (img) {
            var src = img.getAttribute('src');
            if (src && src.startsWith('/t/')) {
                map[slug] = BASE + src;
            }
        }
    });
    return map;
}

// Build one card with shimmer placeholder
function buildCard(slug, imgUrl, paperInfo) {
    var card = document.createElement('div');
    card.className = 'paper';

    var shimmer = document.createElement('div');
    shimmer.className = 'shimmer';
    card.appendChild(shimmer);

    var img = document.createElement('img');
    img.alt = paperInfo.name;
    img.loading = 'eager';
    img.decoding = 'async';
    img.fetchPriority = 'high';
    card.appendChild(img);

    var label = document.createElement('div');
    label.className = 'label';
    label.innerHTML = '<span class="name">' + paperInfo.name + '</span><span class="region">' + paperInfo.region + '</span>';
    card.appendChild(label);

    card.addEventListener('click', function() {
        openModal(paperInfo.name, imgUrl, paperInfo.url);
    });

    // Store the URL for later
    card._imgUrl = imgUrl;

    return card;
}

// Modal
function openModal(name, imgUrl, siteUrl) {
    document.getElementById('mTitle').textContent = name;
    document.getElementById('mLink').href = siteUrl;
    document.getElementById('mBody').innerHTML = '<img src="' + imgUrl + '" alt="' + name + '">';
    document.getElementById('modalBg').classList.add('open');
}
function closeModal() { document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('mClose').addEventListener('click', closeModal);
document.getElementById('modalBg').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

// Main
async function init() {
    var building = document.getElementById('building');
    var loadingMsg = document.getElementById('loadingMsg');

    // Fetch listing pages to get thumbnail URLs
    var imageMap = {};

    var pages = [
        BASE + '/us-newspapers/',
        BASE + '/financial-newspapers/',
        BASE + '/world-newspapers/'
    ];

    var fetches = pages.map(function(url) { return fetchWithProxy(url); });
    var results = await Promise.all(fetches);

    results.forEach(function(html) {
        if (!html) return;
        var parsed = parseListingHTML(html);
        Object.keys(parsed).forEach(function(slug) {
            imageMap[slug] = parsed[slug];
        });
    });

    // Some slugs on frontpages.com differ slightly — try alternate forms
    var altSlugs = {
        'the-times-uk': ['the-times', 'the-times-uk', 'the-times-and-the-sunday-times'],
        'the-guardian': ['the-guardian', 'the-guardian-uk', 'the-guardian-usa'],
        'south-china-morning-post': ['south-china-morning-post', 'scmp'],
        'the-straits-times': ['the-straits-times', 'straits-times'],
        'haaretz': ['haaretz', 'ha-aretz'],
        'the-times-of-india': ['the-times-of-india', 'times-of-india'],
        'the-sydney-morning-herald': ['the-sydney-morning-herald', 'sydney-morning-herald'],
        'the-washington-times': ['the-washington-times', 'washington-times'],
    };

    // Match papers to discovered images
    var sections = {};
    var matchCount = 0;
    var slugKeys = Object.keys(PAPERS);

    slugKeys.forEach(function(slug) {
        var paper = PAPERS[slug];
        var imgUrl = imageMap[slug];

        // Try alternates
        if (!imgUrl && altSlugs[slug]) {
            for (var i = 0; i < altSlugs[slug].length; i++) {
                if (imageMap[altSlugs[slug][i]]) {
                    imgUrl = imageMap[altSlugs[slug][i]];
                    break;
                }
            }
        }

        if (!imgUrl) return; // Skip papers we couldn't find

        if (!sections[paper.section]) sections[paper.section] = [];
        sections[paper.section].push({ slug: slug, imgUrl: imgUrl, info: paper });
        matchCount++;
    });

    // Clear loading message
    loadingMsg.remove();

    if (matchCount === 0) {
        building.innerHTML = '<div class="loading-msg">Unable to load front pages. Please try refreshing.</div>';
        return;
    }

    // Build all section labels, grids, and cards into the DOM immediately (shimmer placeholders visible)
    var sectionOrder = ['United States', 'United Kingdom & Europe', 'Asia & World'];
    var allCards = [];

    sectionOrder.forEach(function(sectionName) {
        var papers = sections[sectionName];
        if (!papers || papers.length === 0) return;

        var label = document.createElement('div');
        label.className = 'section-label';
        label.textContent = sectionName;
        building.appendChild(label);

        var grid = document.createElement('div');
        grid.className = 'grid';

        papers.forEach(function(p) {
            var card = buildCard(p.slug, p.imgUrl, p.info);
            grid.appendChild(card);
            allCards.push(card);
        });

        building.appendChild(grid);
    });

    // Add a progress indicator
    var progressMsg = document.createElement('div');
    progressMsg.className = 'progress-msg';
    progressMsg.textContent = 'Loading front pages: 0 / ' + allCards.length;
    building.appendChild(progressMsg);

    // Fire ALL image loads in parallel — each card reveals itself the instant its image is ready
    var loaded = 0;
    var total = allCards.length;

    var imagePromises = allCards.map(function(card) {
        return new Promise(function(resolve) {
            var img = card.querySelector('img');
            var shimmer = card.querySelector('.shimmer');

            img.onload = function() {
                img.classList.add('loaded');
                if (shimmer) shimmer.classList.add('done');
                loaded++;
                progressMsg.textContent = 'Loading front pages: ' + loaded + ' / ' + total;
                resolve();
            };
            img.onerror = function() {
                card.classList.add('hidden');
                loaded++;
                progressMsg.textContent = 'Loading front pages: ' + loaded + ' / ' + total;
                resolve();
            };

            // Kick off the fetch immediately
            img.src = card._imgUrl;
        });
    });

    // Wait for all to finish, then remove progress
    await Promise.all(imagePromises);
    progressMsg.style.opacity = '0';
    setTimeout(function() { progressMsg.remove(); }, 300);
}

init();

// Stars
var sc = document.getElementById('stars');
for (var i = 0; i < 60; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    var sz = (Math.random() > .85 ? 1.5 : 1) + 'px';
    s.style.cssText = 'width:'+sz+';height:'+sz+';left:'+Math.random()*100+'%;top:'+Math.random()*55+'%;opacity:'+(0.1+Math.random()*0.4)+';animation-delay:'+Math.random()*4+'s;';
    sc.appendChild(s);
}
</script>
</body>
</html>
